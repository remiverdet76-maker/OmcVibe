name: Build OmchaWatch debug APK

on:
  push:
    branches:
      - main
      - "claude/omchawatch-**"
    paths:
      - "omchawatch-app/**"
      - ".github/workflows/build-omchawatch-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web deps
        working-directory: omchawatch-app
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: omchawatch-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: omchawatch-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmchaWatch-debug-apk
          path: omchawatch-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK into repository
        run: |
          cp omchawatch-app/android/app/build/outputs/apk/debug/app-debug.apk ./OmchaWatch-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add OmchaWatch-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add OmchaWatch-debug.apk [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "APK unchanged, nothing to commit."
          fi
