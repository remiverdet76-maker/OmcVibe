<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>OmcV — La Sphère de Solônde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#07060d; --bg1:#0c0a1a;
    --gold:#d4a843; --gold2:#f5d97a;
    --ink:#f3ecdd; --ink-dim: rgba(243,236,221,0.62);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%; overflow:hidden; background:var(--bg0);
    font-family:'Cormorant Garamond', serif; color:var(--ink);
    -webkit-tap-highlight-color:transparent; touch-action:none;
  }
  #stage{
    position:fixed; inset:0; overflow:hidden;
    background:
      radial-gradient(ellipse 70% 50% at 50% 18%, rgba(232,74,74,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(123,88,212,0.12) 0%, transparent 55%),
      radial-gradient(circle at 50% 42%, #16122a 0%, #0c0a1a 45%, #07060d 100%);
  }
  #stars{position:absolute; inset:0; z-index:0;}
  canvas#gl{position:absolute; inset:0; z-index:1; display:block; cursor:grab;}
  canvas#gl:active{cursor:grabbing;}
  .noise{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    opacity:.035; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  header{
    position:absolute; top:0; left:0; right:0; z-index:5;
    text-align:center; padding:26px 20px 0;
    transition:opacity 1.1s ease, transform 1.1s ease;
  }
  header h1{
    font-family:'Cinzel',serif; font-weight:600;
    font-size:clamp(1.05rem,3.2vw,1.8rem); letter-spacing:.09em;
    background:linear-gradient(96deg,#e8384a,var(--gold2),#7b58d4,#e8384a);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(212,168,67,0.25));
  }
  header p{margin-top:6px; font-style:italic; font-size:.88rem; color:var(--ink-dim);}
  .fade-out{opacity:0 !important; transform:translateY(-8px); pointer-events:none;}

  #hint{
    position:absolute; left:22px; bottom:26px; z-index:5;
    font-size:.74rem; color:var(--ink-dim); font-style:italic;
    opacity:.55; max-width:220px; transition:opacity .9s ease;
  }
  #meditateWord{
    position:absolute; left:50%; top:50%; z-index:4; transform:translate(-50%,-50%);
    font-family:'Cinzel',serif; font-size:1.05rem; letter-spacing:.35em;
    text-transform:uppercase; color:var(--gold2); opacity:0; pointer-events:none;
    text-shadow:0 0 24px rgba(245,217,122,0.5); transition:opacity 2.6s ease;
  }
  #controls{
    position:absolute; left:50%; bottom:26px; z-index:6; transform:translateX(-50%);
    display:flex; gap:8px; padding:8px; border-radius:999px;
    background:rgba(18,15,30,0.55); border:1px solid rgba(212,168,67,0.25);
    backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 12px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  #controls button{
    font-family:'Cormorant Garamond', serif; font-size:.86rem; letter-spacing:.03em;
    color:var(--ink-dim); background:transparent; border:1px solid transparent;
    padding:9px 18px; border-radius:999px; cursor:pointer; transition:all .35s ease; white-space:nowrap;
  }
  #controls button:hover{color:var(--ink);}
  #controls button.active{
    color:#1a1408; background:linear-gradient(120deg,var(--gold2),var(--gold));
    box-shadow:0 4px 18px rgba(212,168,67,0.45);
  }

  /* --- Axe Y tactile (curseur de densité) --- */
  #yaxis{
    position:absolute; right:18px; top:50%; transform:translateY(-50%);
    z-index:6; display:flex; align-items:center; gap:10px; height:min(64vh,460px);
    transition:opacity .9s ease;
  }
  #ytrack{
    position:relative; width:6px; height:100%; border-radius:999px;
    background:linear-gradient(180deg,#7b58d4,#4a6fd4 18%,#3ab8a0 38%,#f5d97a 50%,#e8833a 62%,#e8384a 82%,#8a1030);
    box-shadow:0 0 14px rgba(212,168,67,0.25);
    touch-action:none;
  }
  .ytick{
    position:absolute; left:-4px; width:14px; height:1.5px; background:rgba(255,255,255,0.55);
  }
  .ylabel{
    position:absolute; left:16px; transform:translateY(-50%);
    font-size:.7rem; font-style:italic; color:var(--ink-dim); white-space:nowrap;
  }
  #ythumb{
    position:absolute; left:50%; width:22px; height:22px; border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%,#fff8ea,#f5d97a 55%,#c98a2a 100%);
    box-shadow:0 0 16px rgba(245,217,122,0.75), 0 2px 6px rgba(0,0,0,0.5);
    cursor:grab; touch-action:none;
  }
  #yreadout{
    position:absolute; right:44px; top:50%; transform:translateY(-50%);
    min-width:150px; text-align:right; pointer-events:none;
    transition:opacity .9s ease;
  }
  #yreadout .note{font-family:'Cinzel',serif; font-size:1.35rem; color:var(--gold2); letter-spacing:.06em; text-shadow:0 0 14px rgba(245,217,122,0.4);}
  #yreadout .val{font-size:.85rem; color:var(--ink-dim);}
  #yreadout .z{font-size:.72rem; color:var(--ink-dim); opacity:.75;}

  @media (max-width:640px){
    #yaxis{height:48vh; right:10px;}
    #yreadout{right:34px; min-width:110px;}
    #yreadout .note{font-size:1.1rem;}
    #hint{max-width:150px; font-size:.68rem;}
    #controls button{padding:9px 13px; font-size:.78rem;}
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="stars"></canvas>
  <canvas id="gl"></canvas>
  <div class="noise"></div>

  <header>
    <h1>OmcV — La Sphère de Solônde</h1>
    <p>Le centre respire (11/10 ↔ 10/11) · l'anneau ferme le champ de densité</p>
  </header>

  <div id="hint">glisser : tourner · pincer / molette : zoomer · curseur latéral : niveau de densité</div>
  <div id="meditateWord">respire</div>

  <div id="yaxis">
    <div id="ytrack">
      <div id="ythumb"></div>
    </div>
  </div>
  <div id="yreadout">
    <div class="note" id="yNoteName">Sol</div>
    <div class="val" id="yValue">142560</div>
    <div class="z" id="yZ">rayon Z — 1.00</div>
  </div>

  <div id="controls">
    <button id="btnRecenter">Recentrer</button>
    <button id="btnMeditate">Méditation</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
(function(){
"use strict";

/* ================= LES 7 COUPES (axe Y de densité) ================= */
/* Valeurs dérivées du modèle : Do/Si = pôles ±élasticité, Sol = centre 142560,
   La/Fa = mi-chemin centre↔pôle, Mi/Re = pôle été / au-delà (142560×6/5 moyenné). */
const NOTES = [
  {name:'Do', value:118800},               // 142560 × 5/6 — limite de contraction
  {name:'Si', value:129600},               // 360×360 — solstice hiver
  {name:'La', value:136080},               // (142560+129600)/2
  {name:'Sol',value:142560},               // 396×360 — centre neutre
  {name:'Fa', value:149040},               // (142560+155520)/2
  {name:'Mi', value:155520},               // 360×432 — solstice été
  {name:'Re', value:163296},               // (171072+155520)/2
];
const V_MIN = NOTES[0].value, V_MAX = NOTES[NOTES.length-1].value;

/* ================= STARFIELD ================= */
(function stars(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let pts = [];
  function resize(){
    c.width = innerWidth*devicePixelRatio; c.height = innerHeight*devicePixelRatio;
    c.style.width = innerWidth+'px'; c.style.height = innerHeight+'px';
    const n = Math.floor((innerWidth*innerHeight)/9000);
    pts = Array.from({length:n},()=>({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.3*devicePixelRatio+0.2,
      a:Math.random()*0.6+0.15, tw:Math.random()*0.015+0.004, p:Math.random()*Math.PI*2
    }));
  }
  function draw(t){
    ctx.clearRect(0,0,c.width,c.height);
    for(const s of pts){
      const a = s.a + Math.sin(t*s.tw*60+s.p)*0.18;
      ctx.beginPath(); ctx.fillStyle = `rgba(243,236,221,${Math.max(0,a)})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(t2=>draw(t2/1000));
  }
  addEventListener('resize', resize); resize(); draw(0);
})();

/* ================= THREE.JS ================= */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.05, 100);

const world = new THREE.Group();
scene.add(world);
world.rotation.z = THREE.MathUtils.degToRad(-22);

scene.add(new THREE.AmbientLight(0x9a86c9, 0.5));
const key = new THREE.PointLight(0xffe3b0, 2.4, 20, 2); key.position.set(2.2,1.6,2.6); scene.add(key);
const rim = new THREE.PointLight(0x7b58d4, 1.0, 20, 2); rim.position.set(-2.6,-1.2,-2.2); scene.add(rim);

/* ---- échelle de la scène ---- */
const TORUS_R = 1.0;
const SPHERE_R = 0.105;   // ~10x plus petite que dans la v1 (relativement à l'anneau)

/* ---- texture de flux interne : rouge (432) → violet foncé (396) ---- */
function makeFluxTexture(){
  const W = 864, H = 256;
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx = cv.getContext('2d');
  const seamFrac = 396/432; // 0.9167 — début du segment sombre
  for(let x=0;x<W;x++){
    const u = x/W;
    let hue, light, sat=68;
    if(u<=seamFrac){
      hue = (u/seamFrac)*270;         // rouge (0°) -> violet (270°)
      light = 54;
    } else {
      const t2 = (u-seamFrac)/(1-seamFrac);
      hue = 270; light = 54 - t2*42;  // violet -> presque noir
      sat = 68 - t2*20;
    }
    ctx.fillStyle = `hsl(${hue},${sat}%,${light}%)`;
    ctx.fillRect(x,0,1,H);
  }
  // légère variation verticale (plus lumineux à l'équateur)
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(0,0,0,0.35)'); grad.addColorStop(0.5,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}
const fluxTex = makeFluxTexture();
const fluxTex2 = fluxTex.clone(); fluxTex2.needsUpdate = true;

/* ---- la sphère centrale (soleil), fermée, déformation légère 11/10 ↔ 10/11 ---- */
const planet = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 96, 96),
  new THREE.MeshStandardMaterial({
    map:fluxTex, emissive:0xffffff, emissiveMap:fluxTex2, emissiveIntensity:0.85,
    roughness:0.5, metalness:0.05
  })
);
world.add(planet);

const glow = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R*1.35, 48, 48),
  new THREE.MeshBasicMaterial({color:0xffcf8a, transparent:true, opacity:0.16, side:THREE.BackSide})
);
world.add(glow);

/* ---- anneau externe : tube toroïdal translucide qui ferme le champ ---- */
const torus = new THREE.Mesh(
  new THREE.TorusGeometry(TORUS_R, 0.014, 20, 160),
  new THREE.MeshPhysicalMaterial({
    color:0xf5d97a, transparent:true, opacity:0.30, roughness:0.15, metalness:0.2,
    transmission:0.35, thickness:0.05, emissive:0xd4a843, emissiveIntensity:0.25
  })
);
torus.rotation.x = Math.PI/2;
world.add(torus);

/* petit halo sur le tube pour le lire comme "cadran fermé" */
const torusGuide = new THREE.Mesh(
  new THREE.TorusGeometry(TORUS_R, 0.003, 8, 160),
  new THREE.MeshBasicMaterial({color:0xfff3d0, transparent:true, opacity:0.5})
);
torusGuide.rotation.x = Math.PI/2;
world.add(torusGuide);

/* ---- 12 repères + rayons solaires alignés ---- */
const DIAL = [
  {v:36},{v:72},{v:108,label:'lever'},{v:144},{v:180},{v:216,label:'zénith'},
  {v:252},{v:288},{v:324,label:'coucher'},{v:360},{v:396},{v:432,label:'minuit'}
];
function labelSprite(text, accent){
  const cv = document.createElement('canvas'); cv.width=192; cv.height=96;
  const ctx = cv.getContext('2d');
  ctx.font = accent ? "600 40px 'Cinzel', serif" : "44px 'Cormorant Garamond', serif";
  ctx.fillStyle = accent ? '#f5d97a' : 'rgba(243,236,221,0.85)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor = accent ? 'rgba(245,217,122,0.9)' : 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = accent ? 18 : 6;
  ctx.fillText(text, 96, 48);
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
  const spr = new THREE.Sprite(mat);
  spr.scale.set(accent?0.24:0.16, accent?0.12:0.08, 1);
  return spr;
}
const rayGroup = new THREE.Group();
DIAL.forEach(d=>{
  const a = (d.v/432)*Math.PI*2 - Math.PI/2;
  const x = Math.cos(a), z = Math.sin(a);

  // rayon solaire : du bord de la sphère (équateur, rayon fixe) jusqu'au tube
  const pts = [
    new THREE.Vector3(x*SPHERE_R, 0, z*SPHERE_R),
    new THREE.Vector3(x*TORUS_R, 0, z*TORUS_R)
  ];
  const rayGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const rayMat = new THREE.LineBasicMaterial({color:0xffdca0, transparent:true, opacity: d.label?0.85:0.4});
  rayGroup.add(new THREE.Line(rayGeo, rayMat));

  // repère chiffré, posé juste au-delà du tube
  const spr = labelSprite(String(d.v), !!d.label);
  spr.position.set(x*(TORUS_R+0.10), 0, z*(TORUS_R+0.10));
  rayGroup.add(spr);

  if(d.label){
    const nameSpr = labelSprite(d.label, false);
    nameSpr.position.set(x*(TORUS_R+0.20), 0, z*(TORUS_R+0.20));
    nameSpr.scale.set(0.20,0.09,1);
    rayGroup.add(nameSpr);
  }
});
world.add(rayGroup);

/* ================= DISQUE DE COUPE (X), piloté par l'axe Y ================= */
const cutDisk = new THREE.Mesh(
  new THREE.CircleGeometry(SPHERE_R, 64),
  new THREE.MeshBasicMaterial({color:0xf5d97a, transparent:true, opacity:0.32, side:THREE.DoubleSide, depthWrite:false})
);
cutDisk.rotation.x = Math.PI/2;
world.add(cutDisk);
const cutRing = new THREE.Mesh(
  new THREE.TorusGeometry(SPHERE_R, 0.0015, 8, 64),
  new THREE.MeshBasicMaterial({color:0xfff3d0, transparent:true, opacity:0.9})
);
cutRing.rotation.x = Math.PI/2;
world.add(cutRing);

let sliderT = (NOTES[3].value - V_MIN)/(V_MAX - V_MIN); // départ sur Sol (centre)

function updateCutDisk(scaleY){
  const c = SPHERE_R*scaleY;            // demi-axe polaire courant
  const h = -c + sliderT*2*c;           // hauteur (niveau choisi par l'utilisateur)
  const a = SPHERE_R;                   // demi-axe équatorial (constant)
  const ratio = Math.max(0, 1 - (h*h)/(c*c));
  const z = a*Math.sqrt(ratio);         // rayon de la coupe (Z)
  cutDisk.position.y = h; cutDisk.scale.set(z/SPHERE_R, z/SPHERE_R, 1);
  cutRing.position.y = h; cutRing.scale.set(z/SPHERE_R, z/SPHERE_R, 1);
  return z;
}

/* ---- lecture / UI de l'axe Y ---- */
const yTrack = document.getElementById('ytrack');
const yThumb = document.getElementById('ythumb');
const elNote = document.getElementById('yNoteName');
const elVal = document.getElementById('yValue');
const elZ = document.getElementById('yZ');

NOTES.forEach(n=>{
  const f = (n.value - V_MIN)/(V_MAX - V_MIN);
  const tick = document.createElement('div');
  tick.className='ytick'; tick.style.bottom = (f*100)+'%';
  yTrack.appendChild(tick);
  const lbl = document.createElement('div');
  lbl.className='ylabel'; lbl.style.bottom = (f*100)+'%';
  lbl.textContent = n.name;
  yTrack.appendChild(lbl);
});

function nearestNote(t){
  const v = V_MIN + t*(V_MAX-V_MIN);
  let best = NOTES[0], bd = Infinity;
  NOTES.forEach(n=>{ const d = Math.abs(n.value-v); if(d<bd){bd=d; best=n;} });
  return {note:best, value:v};
}
function renderReadout(){
  const {note, value} = nearestNote(sliderT);
  elNote.textContent = note.name;
  elVal.textContent = Math.round(value);
}
function setThumb(){ yThumb.style.bottom = (sliderT*100)+'%'; }

let draggingY = false;
function yFromClientY(clientY){
  const r = yTrack.getBoundingClientRect();
  let t = 1 - (clientY - r.top)/r.height;
  return Math.max(0, Math.min(1, t));
}
yTrack.addEventListener('pointerdown', e=>{ draggingY=true; sliderT=yFromClientY(e.clientY); setThumb(); renderReadout(); });
addEventListener('pointermove', e=>{ if(draggingY){ sliderT=yFromClientY(e.clientY); setThumb(); renderReadout(); } });
addEventListener('pointerup', ()=>{
  if(draggingY){ // aimantation douce vers la coupe la plus proche
    const {note} = nearestNote(sliderT);
    sliderT = (note.value - V_MIN)/(V_MAX - V_MIN);
    setThumb(); renderReadout();
  }
  draggingY=false;
});
setThumb(); renderReadout();

/* ================= NAVIGATION : rotation / zoom / pan tactile ================= */
let theta = 0.55, phi = 1.05;
let userTheta = 0, userPhiOffset = 0;
let camDist = 2.55;                 // "zoom max" = distance actuelle par défaut
const MAX_DIST = 2.55, MIN_DIST = 0.55;
let panX = 0, panY = 0;
let meditating = false, autoSpeed = 0.05;

let touches = {};
function dist(t1,t2){ return Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY); }
let pinchStart = null;

canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  touches[e.pointerId] = {x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointermove', e=>{
  if(!touches[e.pointerId]) return;
  const ids = Object.keys(touches);
  const prev = touches[e.pointerId];
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;

  if(ids.length===1){
    userTheta += dx*0.0045;
    userPhiOffset = Math.max(-0.6, Math.min(0.6, userPhiOffset + dy*0.0035));
  } else if(ids.length===2){
    // pan à deux doigts
    panX += dx*0.0016; panY -= dy*0.0016;
    panX = Math.max(-0.9, Math.min(0.9, panX));
    panY = Math.max(-0.7, Math.min(0.7, panY));
  }
  touches[e.pointerId] = {x:e.clientX,y:e.clientY};
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  canvas.addEventListener(ev, e=>{ delete touches[e.pointerId]; });
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camDist = Math.max(MIN_DIST, Math.min(MAX_DIST, camDist + e.deltaY*0.0016));
}, {passive:false});

/* pinch pour tactile : distance entre 2 pointeurs */
let lastPinch = null;
canvas.addEventListener('pointermove', e=>{
  const ids = Object.keys(touches);
  if(ids.length===2){
    const pts = ids.map(id=>touches[id]);
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(lastPinch!=null){
      const delta = (lastPinch - d)*0.006;
      camDist = Math.max(MIN_DIST, Math.min(MAX_DIST, camDist + delta));
    }
    lastPinch = d;
  } else { lastPinch = null; }
});

document.getElementById('btnRecenter').addEventListener('click', ()=>{
  userTheta=0; userPhiOffset=0; panX=0; panY=0; camDist=MAX_DIST;
});
document.getElementById('btnMeditate').addEventListener('click', (e)=>{
  meditating = !meditating;
  e.target.classList.toggle('active', meditating);
  document.querySelectorAll('header,#hint,#yaxis,#yreadout').forEach(el=>el.classList.toggle('fade-out', meditating));
  document.getElementById('meditateWord').style.opacity = meditating ? 0.85 : 0;
  autoSpeed = meditating ? 0.015 : 0.05;
});

/* ================= BOUCLE D'ANIMATION ================= */
let t0 = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now-t0)/1000; t0 = now;
  const t = now/1000;

  theta += autoSpeed*dt;
  const effPhi = Math.max(0.12, Math.min(1.45, phi + userPhiOffset));
  const effTheta = theta + userTheta;

  camera.position.set(
    panX*1.2 + camDist*Math.sin(effPhi)*Math.cos(effTheta),
    panY*1.0 + camDist*Math.cos(effPhi),
    camDist*Math.sin(effPhi)*Math.sin(effTheta)
  );
  camera.lookAt(panX*1.2, panY, 0);

  // respiration du centre : 11/10 ↔ 10/11 le long de l'axe polaire
  const breathe = meditating ? Math.sin(t*0.28) : Math.sin(t*0.55);
  const scaleY = 1 + breathe*0.10; // ~ [10/11 .. 11/10]
  planet.scale.set(1, scaleY, 1);
  glow.scale.set(1, scaleY, 1);

  planet.rotation.y += 0.03*dt;
  fluxTex.offset.x = (fluxTex.offset.x + dt*0.015) % 1;
  fluxTex2.offset.x = fluxTex.offset.x;

  updateCutDisk(scaleY);
  const z = updateCutDisk(scaleY);
  if(!draggingY) document.getElementById('yZ').textContent = 'rayon Z — ' + z.toFixed(3);

  torus.rotation.z += 0.0015;

  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

})();
</script>
</body>
</html>
